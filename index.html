<meta name="description" content="Wendell 的技术博客 —— 后端、隐私计算、系统设计与日常思考。" />

<!-- 主题脚本：防 FOUC，必须在 <style> 之前运行 -->
<script>
(function() {
  try {
    var saved = localStorage.getItem('lp_theme');
    var prefers = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved || (prefers ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
})();
</script>

<style>
  :root {
    --bg: #fafafa;
    --fg: #222;
    --fg-muted: #6a737d;
    --fg-soft: #57606a;
    --border: #eaecef;
    --link: #0366d6;
    --tag-bg: #eef4ff;
    --tag-fg: #0550ae;
    --code-bg: #f6f8fa;
    --panel: #ffffff;
    --panel-hover: #f6f8fa;
    --max-width: 1080px;
    --reading-width: 760px;
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --fg: #e6edf3;
    --fg-muted: #7d8590;
    --fg-soft: #9ca3af;
    --border: #21262d;
    --link: #58a6ff;
    --tag-bg: #1f2a3a;
    --tag-fg: #79c0ff;
    --code-bg: #161b22;
    --panel: #161b22;
    --panel-hover: #1c2128;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Helvetica Neue", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 顶栏 */
  header.site {
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header.site .inner {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 18px 24px;
    display: flex; align-items: center; gap: 20px;
  }
  header.site h1 {
    margin: 0; font-size: 18px; font-weight: 700;
    letter-spacing: .3px;
  }
  header.site h1 a { color: var(--fg); }
  header.site nav { margin-left: auto; display: flex; gap: 16px; align-items: center; }
  header.site nav a { color: var(--fg-soft); font-size: 14px; }
  .theme-toggle {
    background: transparent; border: 1px solid var(--border);
    color: var(--fg-soft); width: 30px; height: 30px;
    border-radius: 50%; cursor: pointer; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .theme-toggle:hover { color: var(--link); border-color: var(--link); }
  :root[data-theme="dark"] .theme-toggle .moon { display: none; }
  :root:not([data-theme="dark"]) .theme-toggle .sun { display: none; }

  main {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  main.reading {
    max-width: var(--reading-width);
  }

  /* 文章右侧时间轴目录 */
  .toc {
    position: fixed;
    top: 110px;
    right: max(20px, calc((100vw - 1080px) / 2 - 240px));
    width: 220px;
    max-height: calc(100vh - 160px);
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.55;
    padding: 4px 0 4px 14px;
    border-left: 1px solid var(--border);
    z-index: 10;
  }
  .toc a, .toc a:hover, .toc a:visited {
    color: var(--fg-soft);
    text-decoration: none;
  }
  .toc-title {
    font-size: 12px; color: var(--fg-muted); font-weight: 600;
    letter-spacing: .5px; text-transform: uppercase;
    margin-bottom: 10px; margin-left: -2px;
  }
  .toc ol { list-style: none; padding: 0; margin: 0; }
  .toc li { position: relative; margin: 0; }
  .toc li > a {
    display: block;
    padding: 6px 4px 6px 14px;
    color: var(--fg-muted);
    text-decoration: none;
    border-left: 2px solid transparent;
    margin-left: -16px;
    transition: color .15s, border-color .15s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .toc li > a:hover { color: var(--fg); text-decoration: none; }
  .toc li.active > a {
    color: var(--link);
    border-left-color: var(--link);
    font-weight: 600;
  }
  .toc li.h3 > a {
    padding-left: 28px;
    font-size: 13px;
  }
  /* 归档时间轴（主页专用） */
  .toc .tl-year {
    margin-top: 10px;
  }
  .toc .tl-year:first-child { margin-top: 0; }
  .toc .tl-year > .tl-head {
    display: block;
    padding: 4px 4px 4px 10px;
    color: var(--fg);
    font-weight: 700; font-size: 14px;
    border-left: 2px solid transparent;
    margin-left: -12px;
    cursor: pointer; text-decoration: none;
    transition: color .15s, border-color .15s;
  }
  .toc .tl-year.active > .tl-head {
    color: var(--fg);
    border-left-color: var(--fg);
  }
  .toc .tl-year > .tl-head:hover { color: var(--fg); text-decoration: none; }
  .toc .tl-month {
    display: block;
    padding: 6px 4px 4px 10px;
    font-size: 11.5px;
    color: var(--fg-muted);
    font-weight: 600;
    letter-spacing: .3px;
  }
  .toc .tl-month .cnt {
    color: var(--fg-muted); opacity: .6; margin-left: 4px; font-size: 11px; font-weight: 400;
  }
  .toc .tl-post {
    display: block;
    padding: 3px 4px 3px 22px;
    font-size: 13px;
    color: var(--fg-soft) !important;
    text-decoration: none;
    border-left: 2px solid transparent;
    margin-left: -12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color .15s, border-color .15s;
    line-height: 1.45;
  }
  .toc .tl-post:hover { color: var(--fg) !important; }
  .toc .tl-post.active {
    color: var(--fg) !important;
    border-left-color: var(--fg);
    font-weight: 600;
  }
  .toc::-webkit-scrollbar { width: 0; }
  @media (max-width: 1560px) { .toc { display: none; } }

  /* 列表页 */
  .post-list { list-style: none; padding: 0; margin: 0; }
  .post-item {
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
  }
  .post-item h2 {
    margin: 0 0 6px; font-size: 19px; font-weight: 600;
  }
  .post-item h2 a { color: var(--fg); }
  .post-item h2 a:hover { color: var(--link); text-decoration: none; }
  .post-meta {
    font-size: 12px; color: var(--fg-muted);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .post-tag {
    display: inline-block;
    background: var(--tag-bg); color: var(--tag-fg);
    padding: 1px 8px; border-radius: 10px; font-size: 11px;
  }
  .post-summary {
    color: var(--fg-soft); font-size: 14px; margin: 4px 0 0;
  }

  /* 搜索 / 标签栏 */
  .filter-bar {
    display: flex; gap: 10px; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .filter-bar input {
    flex: 1; min-width: 200px;
    padding: 8px 12px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--fg);
  }
  .filter-bar input:focus { outline: none; border-color: var(--link); }
  .tag-cloud { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag-cloud button {
    background: var(--tag-bg); color: var(--tag-fg);
    border: none; padding: 3px 10px; border-radius: 10px;
    font-size: 12px; cursor: pointer;
  }
  .tag-cloud button.active {
    background: var(--tag-fg); color: #fff;
  }
  .empty {
    color: var(--fg-muted); padding: 40px 0; text-align: center;
  }

  /* Skills Hub */
  .page-head {
    margin-bottom: 20px;
  }
  .page-head h1 {
    margin: 0 0 4px; font-size: 22px; font-weight: 700;
  }
  .page-head p {
    margin: 0; color: var(--fg-muted); font-size: 13px;
  }
  .skill-list { list-style: none; padding: 0; margin: 0; }
  .skill-item {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 18px 0; border-bottom: 1px solid var(--border);
  }
  .skill-body { flex: 1; min-width: 0; }
  .skill-body h2 {
    margin: 0 0 4px; font-size: 16px; font-weight: 600;
    display: flex; align-items: baseline; gap: 8px;

  .skill-body h2 a { color: var(--fg); }
  .skill-body h2 a:hover { color: var(--link); text-decoration: none; }

    font-size: 11px; color: var(--fg-muted); font-weight: 400;
  }

  .skill-body .meta {

    flex-shrink: 0;
    display: flex; flex-direction: column; gap: 6px; align-items: stretch;

  .skill-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 6px 14px; font-size: 13px;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;

  .skill-btn:hover {
    color: var(--link); border-color: var(--link);
    text-decoration: none;
  }
  .skill-btn .size {
    font-size: 11px; color: var(--fg-muted);
  }
  .skill-btn.primary {
    background: var(--link); color: #fff; border-color: var(--link);
  }
  .skill-btn.primary:hover { color: #fff; opacity: .9; }

  /* 详情页 */

    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);

  .article-head h1 {

  /* Markdown 正文 */
  .markdown h1 { font-size: 24px; margin: 24px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .markdown h2 { font-size: 20px; margin: 22px 0 10px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .markdown h3 { font-size: 17px; margin: 20px 0 8px; }
  .markdown h4 { font-size: 15px; margin: 16px 0 6px; }
  .markdown p  { margin: 12px 0; }
  .markdown ul, .markdown ol { margin: 10px 0; padding-left: 1.8em; }
  .markdown li { margin: 4px 0; }
  .markdown code {
    background: var(--code-bg); padding: 2px 6px;
    border-radius: 4px; font-size: 13px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .markdown pre {
    background: var(--code-bg); padding: 14px 16px;
    border-radius: 6px; overflow-x: auto; margin: 14px 0;
    font-size: 13px; line-height: 1.55;
  }
  .markdown pre code { background: transparent; padding: 0; font-size: 13px; }
  .markdown blockquote {
    border-left: 4px solid #dfe2e5; color: var(--fg-soft);
    padding: 4px 16px; margin: 14px 0;
  }
  .markdown table {
    border-collapse: collapse; margin: 14px 0;
    font-size: 14px;
  }
  .markdown th, .markdown td {
    border: 1px solid var(--border); padding: 6px 12px;

  .markdown th { background: var(--code-bg); }
  .markdown img { max-width: 100%; border-radius: 4px; }
  .markdown hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  /* PlantUML 块 */
  .plantuml-block {
    margin: 14px 0; padding: 12px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; text-align: center;
    min-height: 60px;
  }
  .plantuml-block svg { max-width: 100%; height: auto; }
  :root[data-theme="dark"] .plantuml-block svg { background: #fafafa; border-radius: 4px; padding: 8px; }
  .plantuml-ph { color: var(--fg-muted); font-size: 12px; padding: 20px; }
  .plantuml-err {
    color: #cf222e; padding: 10px 14px; font-size: 12px;
    background: #fff5f5; border: 1px solid #ffd6d6;
    border-radius: 4px; font-family: monospace; white-space: pre-wrap;
  }

  /* Footer */
  footer {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 30px 24px;
    border-top: 1px solid var(--border);
    color: var(--fg-muted); font-size: 12px;
    text-align: center;
  }
  footer a { color: var(--fg-muted); }

  .loading {
    color: var(--fg-muted); text-align: center; padding: 40px 0;
  }

  /* 返回顶部按钮 */
  .back-to-top {
    position: fixed; right: 24px; bottom: 32px;
    width: 40px; height: 40px;
    background: var(--panel); color: var(--fg-soft);
    border: 1px solid var(--border); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; line-height: 1;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    opacity: 0; transform: translateY(8px);
    transition: opacity .2s, transform .2s, color .15s, border-color .15s;
    pointer-events: none;
    z-index: 100;
  }
  .back-to-top.visible {
    opacity: 1; transform: translateY(0);
    pointer-events: auto;
  }
  .back-to-top:hover {
    color: var(--link); border-color: var(--link);
  }
</style>

<script>
/* ========================================================
   基础工具
======================================================== */
document.getElementById('year').textContent = new Date().getFullYear();
const app = document.getElementById('app');

function escapeHtml(s) {
  return (s == null ? '' : s + '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toISOString().slice(0, 10);
}

/* 中文按 350 字/分，英文按 250 词/分，二者相加后向上取整；最少 1 分钟 */
function readingTime(md) {
  if (!md) return 1;
  // 去掉代码块与 frontmatter，免得 ``` 里的东西被算进去（粗略）
  const stripped = md
    .replace(/^---[\s\S]*?---/m, '')
    .replace(/```[\s\S]*?```/g, '')
    .replace(/`[^`]*`/g, '');
  const cn = (stripped.match(/[\u4e00-\u9fa5]/g) || []).length;
  const en = (stripped.match(/[A-Za-z]+(?:['-][A-Za-z]+)*/g) || []).length;
  const minutes = Math.ceil(cn / 350 + en / 250);
  return Math.max(1, minutes);
}

/* ========================================================
   PlantUML 编码 + 懒加载
======================================================== */
function encode6bit(b) {
  if (b < 10) return String.fromCharCode(48 + b);
  b -= 10; if (b < 26) return String.fromCharCode(65 + b);
  b -= 26; if (b < 26) return String.fromCharCode(97 + b);
  b -= 26; if (b === 0) return '-';
  if (b === 1) return '_'; return '?';
}
function append3bytes(b1, b2, b3) {
  const c1 = b1 >> 2, c2 = ((b1 & 0x3) << 4) | (b2 >> 4),
        c3 = ((b2 & 0xF) << 2) | (b3 >> 6), c4 = b3 & 0x3F;
  return encode6bit(c1 & 0x3F) + encode6bit(c2 & 0x3F) + encode6bit(c3 & 0x3F) + encode6bit(c4 & 0x3F);
}
function encode64(data) {
  let r = '';
  for (let i = 0; i < data.length; i += 3) {
    if (i + 2 === data.length)      r += append3bytes(data[i], data[i+1], 0);
    else if (i + 1 === data.length) r += append3bytes(data[i], 0, 0);
    else                             r += append3bytes(data[i], data[i+1], data[i+2]);
  }
  return r;
}
function plantumlUrl(code) {
  const compressed = pako.deflateRaw(new TextEncoder().encode(code), { level: 9 });
  return 'https://www.plantuml.com/plantuml/svg/' + encode64(compressed);
}
function fetchWithTimeout(url, ms = 8000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(t));
}
const pumlCache = new Map();
async function hydratePlantUML(root) {
  const blocks = [...root.querySelectorAll('.plantuml-block[data-code]')];
  await Promise.allSettled(blocks.map(async el => {
    const code = decodeURIComponent(escape(atob(el.dataset.code)));
    if (pumlCache.has(code)) { el.innerHTML = pumlCache.get(code); return; }
    const url = plantumlUrl(code);
    try {
      const r = await fetchWithTimeout(url, 8000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const svg = await r.text();
      pumlCache.set(code, svg);
      el.innerHTML = svg;
    } catch (e) {
      const msg = e.name === 'AbortError' ? '请求超时' : e.message;
      el.innerHTML = `<div class="plantuml-err">PlantUML 渲染失败：${msg}\n备用：<a href="${url}" target="_blank">在 plantuml.com 打开</a></div>`;
    }
  }));
}

/* ========================================================
   Markdown 渲染（带 PlantUML 占位 + 代码高亮 + 标题 id）
======================================================== */
const _slugCount = {};
function slugify(text) {
  const s = String(text).toLowerCase()
    .replace(/[\s\u00A0]+/g, '-')
    .replace(/[^\w\u4e00-\u9fa5-]/g, '')
    .slice(0, 80) || 'h';
  _slugCount[s] = (_slugCount[s] || 0) + 1;
  return _slugCount[s] === 1 ? s : `${s}-${_slugCount[s]}`;
}

function buildRenderer() {
  const r = new marked.Renderer();
  r.code = function(code, lang) {
    if (typeof code === 'object' && code !== null) { lang = code.lang; code = code.text; }
    const l = (lang || '').toLowerCase();
    if (l === 'plantuml' || l === 'puml') {
      const b64 = btoa(unescape(encodeURIComponent(code)));
      return `<div class="plantuml-block" data-code="${b64}"><div class="plantuml-ph">PlantUML 渲染中…</div></div>`;
    }
    let html;
    try {
      html = lang && hljs.getLanguage(lang)
        ? hljs.highlight(code, { language: lang }).value
        : hljs.highlightAuto(code).value;
    } catch { html = code; }
    return `<pre><code class="hljs language-${lang||''}">${html}</code></pre>`;
  };
  r.heading = function(text, level) {
    let raw = text, html = text;
    if (typeof text === 'object' && text !== null) {
      raw = text.text || ''; level = text.depth;
      try { html = this.parser ? this.parser.parseInline(text.tokens || []) : raw; } catch { html = raw; }
    }
    const id = slugify(String(raw).replace(/<[^>]+>/g, ''));
    return `<h${level} id="${id}">${html}</h${level}>`;
  };
  return r;
}
function renderMarkdown(md) {
  for (const k in _slugCount) delete _slugCount[k];
  marked.setOptions({ gfm: true, breaks: false, renderer: buildRenderer() });
  return DOMPurify.sanitize(marked.parse(md || ''), { ADD_ATTR: ['data-code', 'id'] });
}

/* 拦截文章内 TOC 锚点：href=#xxx 走平滑滚动，不让 SPA 路由把它当成新路径 */
function bindArticleAnchors(root) {
  root.querySelectorAll('a[href^="#"]').forEach(a => {
    const href = a.getAttribute('href') || '';
    // 以 #/ 开头的是 SPA 路由，放行
    if (href.startsWith('#/')) return;
    a.addEventListener('click', (e) => {
      const id = decodeURIComponent(href.slice(1));
      if (!id) return;
      const target = root.querySelector(`[id="${CSS.escape(id)}"]`);
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        // 不改 location.hash，避免 hashchange 触发 router
      }
    });
  });
}

/* ========================================================
   文章右侧时间轴 TOC
======================================================== */
let _tocScrollHandler = null;

function destroyToc() {
  const old = document.getElementById('toc');
  if (old) old.remove();
  if (_tocScrollHandler) {
    window.removeEventListener('scroll', _tocScrollHandler);
    _tocScrollHandler = null;
  }
}

function buildToc(articleEl) {
  destroyToc();
  const headings = [...articleEl.querySelectorAll('h2[id]')];
  if (headings.length < 2) return;

  const toc = document.createElement('nav');
  toc.id = 'toc';
  toc.className = 'toc';
  toc.innerHTML = `
    <div class="toc-title">目录</div>
    <ol>
      ${headings.map(h => `
        <li class="${h.tagName.toLowerCase()}" data-id="${h.id}">
          <a href="#${encodeURIComponent(h.id)}">${escapeHtml(h.textContent.replace(/^\s*\d+\.\s*/, ''))}</a>
        </li>`).join('')}
    </ol>
  `;
  document.body.appendChild(toc);

  // 点击平滑滚动
  toc.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const id = decodeURIComponent(a.getAttribute('href').slice(1));
      const t = articleEl.querySelector(`[id="${CSS.escape(id)}"]`);
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  // scrollspy
  const items = [...toc.querySelectorAll('li')];
  const onScroll = () => {
    const top = window.scrollY + 120;
    let active = headings[0];
    for (const h of headings) {
      if (h.offsetTop <= top) active = h;
      else break;
    }
    items.forEach(li => li.classList.toggle('active', li.dataset.id === active.id));
  };
  _tocScrollHandler = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

/* 主页归档时间轴 */
function buildArchiveToc(posts) {
  destroyToc();
  if (!posts || posts.length < 2) return;

  // 按年 → 月 分组
  const groups = new Map(); // Map<year, Map<month, [posts]>>
  for (const p of posts) {
    const d = String(p.date || '');
    const y = d.slice(0, 4) || '未知';
    const m = d.slice(5, 7) || '00';
    if (!groups.has(y)) groups.set(y, new Map());
    const mm = groups.get(y);
    if (!mm.has(m)) mm.set(m, []);
    mm.get(m).push(p);
  }
  const years = [...groups.keys()].sort((a, b) => b.localeCompare(a));

  const toc = document.createElement('nav');
  toc.id = 'toc';
  toc.className = 'toc';
  toc.innerHTML = `
    <div class="toc-title">归档</div>
    <ol>
      ${years.map(y => {
        const mm = groups.get(y);
        const months = [...mm.keys()].sort((a, b) => b.localeCompare(a));
        return `
          <li class="tl-year" data-year="${y}">
            <a class="tl-head" data-slug="${mm.get(months[0])[0].slug}" href="#post-${mm.get(months[0])[0].slug}">${y}</a>
            ${months.map(m => {
              const list = mm.get(m);
              return `
                <div class="tl-month">${m} 月<span class="cnt">(${list.length})</span></div>
                ${list.map(p => `
                  <a class="tl-post" data-slug="${escapeHtml(p.slug)}" href="#post-${encodeURIComponent(p.slug)}" title="${escapeHtml(p.title)}">${escapeHtml(p.title)}</a>
                `).join('')}
              `;
            }).join('')}
          </li>`;
      }).join('')}
    </ol>
  `;
  document.body.appendChild(toc);

  // 点击跳到对应 post-item
  toc.querySelectorAll('[data-slug]').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const slug = a.dataset.slug;
      const tgt = document.querySelector(`.post-item[data-post-slug="${CSS.escape(slug)}"]`);
      if (tgt) tgt.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  // scrollspy：当前视口中的文章对应的年份 + 文章高亮
  const yearItems = [...toc.querySelectorAll('.tl-year')];
  const postLinks = [...toc.querySelectorAll('.tl-post')];
  const onScroll = () => {
    const items = [...document.querySelectorAll('.post-item')];
    if (!items.length) return;
    const top = window.scrollY + 120;
    let current = items[0];
    for (const it of items) {
      if (it.offsetTop <= top) current = it;
      else break;
    }
    const y = (current.dataset.date || '').slice(0, 4);
    const slug = current.dataset.postSlug;
    yearItems.forEach(li => li.classList.toggle('active', li.dataset.year === y));
    postLinks.forEach(a => a.classList.toggle('active', a.dataset.slug === slug));
  };
  _tocScrollHandler = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

/* ========================================================
   路由 + 数据加载
======================================================== */
let INDEX = null;   // posts/index.json

async function loadIndex() {
  if (INDEX) return INDEX;
  const resp = await fetch('posts/index.json');
  if (!resp.ok) throw new Error('无法加载文章索引：' + resp.status);
  INDEX = await resp.json();
  // 按日期倒序
  INDEX.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return INDEX;
}
async function loadPost(slug) {
  const resp = await fetch(`posts/${slug}.md`);
  if (!resp.ok) throw new Error('文章未找到');
  return resp.text();
}

let SKILLS = null;
async function loadSkills() {
  if (SKILLS) return SKILLS;
  const resp = await fetch('skills/index.json');
  if (!resp.ok) throw new Error('无法加载 skills 索引：' + resp.status);
  SKILLS = await resp.json();
  // 默认按 createdAt 倒序，没该字段则按 name 字典序
  SKILLS.sort((a, b) => {
    if (a.createdAt || b.createdAt) return (b.createdAt || '').localeCompare(a.createdAt || '');
    return (a.name || '').localeCompare(b.name || '');
  });
  return SKILLS;
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}

function route() {
  const hash = location.hash.replace(/^#/, '') || '/';
  // 非 SPA 路由（例如文章内锚点 #some-heading），忽略，不切视图
  if (hash !== '/' && !hash.startsWith('/')) return;
  destroyToc();
  const isReading = /^\/post\/|^\/about$/.test(hash);
  app.classList.toggle('reading', isReading);
  if (hash === '/' || hash === '') return renderList();
  if (hash === '/about')           return renderAbout();
  if (hash === '/skills')          return renderSkillsList();
  const sm = /^\/skill\/([\w\-]+)/.exec(hash);
  if (sm) return renderSkillDetail(sm[1]);
  const m = /^\/post\/([\w\-]+)/.exec(hash);
  if (m) return renderPost(m[1]);
  renderNotFound();
}
window.addEventListener('hashchange', route);

/* ========================================================
   列表页
======================================================== */
let filterState = { q: '', tag: '' };

async function renderList() {
  try {
    const posts = await loadIndex();
    const tagSet = new Set();
    posts.forEach(p => (p.tags || []).forEach(t => tagSet.add(t)));
    const tags = [...tagSet].sort();

    app.innerHTML = `
      <div class="filter-bar">
        <input id="q" type="search" placeholder="搜索标题 / 摘要…" value="${escapeHtml(filterState.q)}">
        <div class="tag-cloud">
          <button data-tag="" class="${filterState.tag === '' ? 'active' : ''}">全部</button>
          ${tags.map(t => `<button data-tag="${escapeHtml(t)}" class="${filterState.tag === t ? 'active' : ''}">${escapeHtml(t)}</button>`).join('')}
        </div>
      </div>
      <ul class="post-list" id="list"></ul>
    `;

    const paint = () => {
      const q = filterState.q.toLowerCase();
      const tag = filterState.tag;
      const filtered = posts.filter(p => {
        if (tag && !(p.tags || []).includes(tag)) return false;
        if (q) {
          const hay = `${p.title||''} ${p.summary||''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      const list = document.getElementById('list');
      if (!filtered.length) {
        list.innerHTML = `<li class="empty">没有符合条件的文章</li>`;
        return;
      }
      list.innerHTML = filtered.map(p => `
        <li class="post-item" data-post-slug="${escapeHtml(p.slug)}" data-date="${escapeHtml(p.date || '')}">
          <h2><a href="#/post/${encodeURIComponent(p.slug)}">${escapeHtml(p.title)}</a></h2>
          <div class="post-meta">
            <span>${fmtDate(p.date)}</span>
            ${p.readingTime ? `<span>约 ${p.readingTime} 分钟</span>` : ''}
            ${(p.tags || []).map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join('')}
          </div>
          ${p.summary ? `<p class="post-summary">${escapeHtml(p.summary)}</p>` : ''}
        </li>
      `).join('');
      buildArchiveToc(filtered);
    };
    paint();

    document.getElementById('q').addEventListener('input', (e) => {
      filterState.q = e.target.value; paint();
    });
    document.querySelectorAll('.tag-cloud button').forEach(b => {
      b.addEventListener('click', () => {
        filterState.tag = b.dataset.tag;
        document.querySelectorAll('.tag-cloud button').forEach(x => x.classList.toggle('active', x === b));
        paint();
      });
    });
  } catch (e) {
    app.innerHTML = `<div class="empty">加载文章失败：${escapeHtml(e.message)}</div>`;
  }
}

/* ========================================================
   详情页
======================================================== */
async function renderPost(slug) {
  app.innerHTML = `<div class="loading">加载中…</div>`;
  try {
    const posts = await loadIndex();
    const meta = posts.find(p => p.slug === slug);
    const raw = await loadPost(slug);

    // 去掉文件开头的 frontmatter（--- ... ---）
    const body = raw.replace(/^---\n[\s\S]*?\n---\n?/, '');
    const rt = meta?.readingTime || readingTime(body);

    const tagsHtml = (meta?.tags || []).map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join(' ');

    app.innerHTML = `
      <a class="back-link" href="#/">← 返回列表</a>
      <div class="article-head">
        <h1>${escapeHtml(meta?.title || slug)}</h1>
        <div class="post-meta">
          <span>${fmtDate(meta?.date)}</span>
          <span>约 ${rt} 分钟</span>
          ${tagsHtml}
        </div>
      </div>
      <article class="markdown" id="article">${renderMarkdown(body)}</article>
    `;
    document.title = (meta?.title || slug) + ' · Wendell\'s Zone';
    hydratePlantUML(document.getElementById('article'));
    bindArticleAnchors(document.getElementById('article'));
    buildToc(document.getElementById('article'));
    window.scrollTo(0, 0);
  } catch (e) {
    app.innerHTML = `
      <a class="back-link" href="#/">← 返回列表</a>
      <div class="empty">加载文章失败：${escapeHtml(e.message)}</div>`;
  }
}

    const resp = await fetch(`skills/${slug}/SKILL.md`);
    if (!resp.ok) throw new Error('SKILL.md 加载失败：' + resp.status);
    const raw = await resp.text();
    const body = raw.replace(/^---\n[\s\S]*?\n---\n?/, '');

    document.title = meta.name + ' · Skills · Wendell\'s Zone';
    app.innerHTML = `
      <a class="back-link" href="#/skills">← 返回 Skills</a>

        <h1>${escapeHtml(meta.name)} <span class="ver" style="font-size:13px;color:var(--fg-muted);font-weight:400">v${escapeHtml(meta.version || '1.0.0')}</span></h1>
        <p class="summary" style="margin:6px 0 10px;color:var(--fg-soft)">${escapeHtml(meta.summary || '')}</p>
        <div class="post-meta">

    app.innerHTML = `
      <a class="back-link" href="#/skills">← 返回 Skills</a>

  }
}

/* ========================================================
   主题切换
======================================================== */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const light = document.getElementById('hljs-light');
  const dark  = document.getElementById('hljs-dark');
  if (light && dark) {
    light.disabled = theme === 'dark';
    dark.disabled  = theme !== 'dark';
  }
}
function currentTheme() {
  return document.documentElement.getAttribute('data-theme') || 'light';
}
// 初始同步一下 hljs 样式表的 disabled 状态（防 FOUC 脚本只改了 data-theme）
applyTheme(currentTheme());
document.getElementById('theme-toggle').addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  localStorage.setItem('lp_theme', next);
  applyTheme(next);
});
// 跨标签页同步（例如你在 live-preview 里切换了主题）
window.addEventListener('storage', (e) => {
  if (e.key === 'lp_theme' && e.newValue) applyTheme(e.newValue);
});

/* ========================================================
   返回顶部
======================================================== */
const backBtn = document.getElementById('back-to-top');
function updateBackBtn() {
  if (window.scrollY > 400) backBtn.classList.add('visible');
  else backBtn.classList.remove('visible');
}
window.addEventListener('scroll', updateBackBtn, { passive: true });
backBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
updateBackBtn();

/* ========================================================
   启动
======================================================== */
route();
</script>
